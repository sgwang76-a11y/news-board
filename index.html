<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920">
<title>今日のニュース</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#c9d8f0;}
body{font-family:"Noto Sans JP","Noto Sans CJK JP","Meiryo","Hiragino Sans",sans-serif;}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;
  background:#d3e0f5;-webkit-transform-origin:0 0;transform-origin:0 0;}

/* ヘッダー（マーケット画面と共通の配置） */
#clock{position:absolute;left:70px;top:25px;font-size:120px;font-weight:bold;color:#e0357f;line-height:1.1;}
#logo{position:absolute;right:80px;top:24px;}
#logo img{height:56px;display:block;}
#date{position:absolute;right:80px;top:92px;font-size:48px;font-weight:bold;color:#1a2a6c;}
#ttl{position:absolute;left:420px;width:1080px;top:30px;text-align:center;color:#1a2a6c;}
#ttl .t{font-size:64px;font-weight:bold;letter-spacing:10px;line-height:1.2;}
#ttl .w{font-size:34px;font-weight:bold;letter-spacing:2px;margin-top:4px;}

/* ニュース本体 */
#card{position:absolute;left:60px;top:180px;width:1800px;height:680px;background:#fff;overflow:hidden;}
#bar{position:absolute;left:0;top:0;width:1800px;height:96px;background:#1f2fb8;}
#no{position:absolute;left:40px;top:0;height:96px;line-height:96px;font-size:68px;font-weight:bold;color:#fff;}
#cat{position:absolute;left:150px;top:18px;height:60px;line-height:60px;padding:0 30px;font-size:38px;font-weight:bold;color:#fff;letter-spacing:3px;}
#cnt{position:absolute;right:40px;top:0;height:96px;line-height:96px;font-size:40px;font-weight:bold;color:#c9d6ff;letter-spacing:2px;}
#hd{position:absolute;left:60px;top:136px;width:1680px;white-space:nowrap;overflow:hidden;
  font-size:92px;font-weight:bold;color:#0f1a4a;line-height:1.2;
  border-left:16px solid #e0357f;padding-left:30px;-webkit-box-sizing:border-box;box-sizing:border-box;}
#rule{position:absolute;left:60px;top:278px;width:1680px;height:4px;background:#d3e0f5;}
#bd{position:absolute;left:60px;top:310px;width:1680px;height:300px;overflow:hidden;
  font-size:54px;line-height:1.62;color:#1d2433;font-weight:bold;}
#nt{color:#c62a24;font-size:0.82em;}
#src{position:absolute;right:50px;bottom:22px;font-size:28px;color:#556;}
#prog{position:absolute;left:0;bottom:0;height:10px;width:0;background:#e0357f;}

/* 下段：今週の一覧 */
#list{position:absolute;left:60px;top:884px;width:1800px;}
#list table{width:1800px;border-collapse:separate;border-spacing:0;table-layout:fixed;}
#list td{padding:0 6px;}
#list td:first-child{padding-left:0;} #list td:last-child{padding-right:0;}
.it{height:146px;background:#eef3fb;border-top:8px solid #9fb3d9;overflow:hidden;padding:10px 10px 0 12px;
  -webkit-box-sizing:border-box;box-sizing:border-box;}
.it .n{font-size:28px;font-weight:bold;color:#1f2fb8;white-space:nowrap;overflow:hidden;letter-spacing:-1px;}
.it .h{font-size:27px;font-weight:bold;color:#334;line-height:1.32;height:72px;margin-top:4px;overflow:hidden;margin-top:2px;}
.it.on{background:#1f2fb8;border-top-color:#e0357f;}
.it.on .n{color:#ffd1e3;} .it.on .h{color:#fff;}

#foot{position:absolute;left:62px;bottom:6px;font-size:20px;color:#334;}
/* ニュースのあとに流す動画（画面全体に表示） */
#vbox{display:none;position:absolute;left:0;top:0;width:1920px;height:1080px;background:#000;}
#vid{width:1920px;height:1080px;display:block;background:#000;}
#pic{display:none;width:1920px;height:1080px;}
/* ===== 不動産ニュースの見た目（#stage に re クラスが付いたとき） ===== */
.sky{display:none;position:absolute;left:0;bottom:0;}
#skyS{opacity:0.10;}
#skyC{opacity:0.06;}
#stage.re{background:#e1e7e5;}
#stage.re .sky{display:block;}
#stage.re #clock{color:#a8752a;}
#stage.re #ttl, #stage.re #date{color:#1e4d4a;}
#stage.re #bar{background:#1e4d4a;}
#stage.re #cnt{color:#cfe1dc;}
#stage.re #hd{color:#13302e;border-left-color:#b8893a;}
#stage.re #rule{background:#e1e7e5;}
#stage.re #bd{color:#1f2e2c;}
#stage.re #prog{background:#b8893a;}
#stage.re .it{background:#f2f5f4;border-top-color:#a9bdb8;}
#stage.re .it .n{color:#1e4d4a;}
#stage.re .it.on{background:#1e4d4a;border-top-color:#b8893a;}
#stage.re .it.on .n{color:#f0d9a8;}
#stage.re #foot{color:#2c4744;}
#err{display:none;position:absolute;left:60px;top:420px;width:1800px;text-align:center;font-size:56px;font-weight:bold;color:#1a2a6c;}
</style>
</head>
<body>
<div id="stage">
 <svg class="sky" id="skyS" xmlns="http://www.w3.org/2000/svg" width="1920" height="460" viewBox="0 0 1920 460" preserveAspectRatio="none"><g fill="#1e4d4a"><rect x="0" y="44" width="104" height="416"/><rect x="51" y="16" width="6" height="28"/><rect x="110" y="25" width="94" height="435"/><rect x="156" y="-3" width="6" height="28"/><rect x="210" y="82" width="54" height="378"/><rect x="220" y="60" width="34" height="22"/><rect x="270" y="46" width="94" height="414"/><rect x="370" y="204" width="84" height="256"/><rect x="460" y="315" width="64" height="145"/><rect x="470" y="293" width="44" height="22"/><rect x="530" y="168" width="54" height="292"/><rect x="590" y="80" width="124" height="380"/><rect x="720" y="104" width="64" height="356"/><rect x="790" y="254" width="94" height="206"/><rect x="800" y="232" width="74" height="22"/><rect x="890" y="69" width="84" height="391"/><rect x="931" y="41" width="6" height="28"/><rect x="980" y="168" width="64" height="292"/><rect x="1050" y="49" width="144" height="411"/><rect x="1200" y="308" width="144" height="152"/><rect x="1350" y="155" width="84" height="305"/><rect x="1440" y="214" width="74" height="246"/><rect x="1520" y="177" width="124" height="283"/><rect x="1581" y="149" width="6" height="28"/><rect x="1650" y="75" width="94" height="385"/><rect x="1696" y="47" width="6" height="28"/><rect x="1750" y="112" width="74" height="348"/><rect x="1760" y="90" width="54" height="22"/><rect x="1830" y="110" width="64" height="350"/><rect x="1840" y="88" width="44" height="22"/><rect x="1900" y="129" width="54" height="331"/></g></svg>
 <div id="clock">--:--</div>
 <div id="ttl"><div class="t" id="tt">今日のニュース</div><div class="w" id="wk"></div></div>
 <div id="logo"><img src="logo.png" alt="青山メインランド"></div>
 <div id="date"></div>

 <div id="card">
  <svg class="sky" id="skyC" xmlns="http://www.w3.org/2000/svg" width="1800" height="330" viewBox="0 0 1800 330" preserveAspectRatio="none"><g fill="#1e4d4a"><rect x="0" y="88" width="94" height="242"/><rect x="100" y="101" width="94" height="229"/><rect x="110" y="79" width="74" height="22"/><rect x="200" y="70" width="94" height="260"/><rect x="210" y="48" width="74" height="22"/><rect x="300" y="154" width="94" height="176"/><rect x="346" y="126" width="6" height="28"/><rect x="400" y="79" width="54" height="251"/><rect x="460" y="72" width="84" height="258"/><rect x="501" y="44" width="6" height="28"/><rect x="550" y="216" width="74" height="114"/><rect x="586" y="188" width="6" height="28"/><rect x="630" y="78" width="104" height="252"/><rect x="681" y="50" width="6" height="28"/><rect x="740" y="148" width="94" height="182"/><rect x="840" y="68" width="104" height="262"/><rect x="850" y="46" width="84" height="22"/><rect x="950" y="114" width="74" height="216"/><rect x="1030" y="50" width="74" height="280"/><rect x="1110" y="224" width="124" height="106"/><rect x="1171" y="196" width="6" height="28"/><rect x="1240" y="129" width="74" height="201"/><rect x="1276" y="101" width="6" height="28"/><rect x="1320" y="133" width="124" height="197"/><rect x="1381" y="105" width="6" height="28"/><rect x="1450" y="56" width="54" height="274"/><rect x="1476" y="28" width="6" height="28"/><rect x="1510" y="218" width="104" height="112"/><rect x="1620" y="124" width="64" height="206"/><rect x="1651" y="96" width="6" height="28"/><rect x="1690" y="32" width="104" height="298"/></g></svg>
  <div id="bar"><div id="no"></div><div id="cat"></div><div id="cnt"></div></div>
  <div id="hd"></div>
  <div id="rule"></div>
  <div id="bd"></div>
  <div id="src"></div>
  <div id="prog"></div>
 </div>

 <div id="list"><table><tr id="lr"></tr></table></div>
 <div id="foot">各見出しは報道・公表資料をもとに作成</div>
 <div id="err">ニュースを読み込めませんでした</div>
 <div id="vbox"><video id="vid" muted playsinline preload="auto"></video><img id="pic" alt=""></div>
</div>

<script>
/* news.js は毎回最新を読み込む（古い保存内容を使わない） */
document.write('<script src="news.js?v=' + new Date().getTime() + '"><\/script>');
</script>
<script>
var CYCLE = 600;              /* 1周10分（サイネージのスケジュールに合わせる） */
var LAPS = 2;                 /* 10分の間に全ニュースを何周させるか */
var CAT_COLOR = {
  "コンプライアンス": "#d9463d",
  "情報セキュリティ": "#e8890c",
  "経済": "#178a5a",
  "不動産": "#0a7fd0",
  "金利": "#0a7fd0",
  "為替": "#6a3fb5",
  "株式市場": "#178a5a",
  "エネルギー": "#b8860b",
  "AI": "#0f8a8a",
  "原油": "#b8860b",
  "プロ野球": "#c2185b",
  "スポーツ": "#c2185b",
  "企業": "#8d6e63"
};
/* 「政治・コンプライアンス」のような組み合わせは、前から順に見て最初に色がある分類の色を使う */
function catParts(c){ return String(c || "").replace(/[【】]/g, "").split(/[・／\/]/); }
function catColor(c){
  c = String(c || "");
  if (CAT_COLOR[c]) return CAT_COLOR[c];
  var p = catParts(c), i;
  for (i = 0; i < p.length; i++) { if (CAT_COLOR[p[i]]) return CAT_COLOR[p[i]]; }
  return "#5a6478";
}
/* 下段の一覧では、枠に収まるよう分類名の先頭だけを出す */
function catShort(c){ return catParts(c)[0]; }
/* 不動産ニュースは全件「不動産」なので、一覧では2つ目の分類（例：マンション市場）を出す */
function listCat(c, theme){ var p = catParts(c); return (theme === "re" && p.length > 1) ? p[1] : p[0]; }
var MARK = "①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳";
var lastIdx = -1, lastPos = -1, items = [];
/* 番組（今日のニュース／不動産ニュース）ごとの開始位置・件数・見た目 */
var SECS = [], curSec = -1;
function secOf(i){ var k; for (k = SECS.length - 1; k >= 0; k--) { if (i >= SECS[k].start) return k; } return 0; }
var SEC = 0, START = new Date().getTime(), lastLoop = -1;
var VSEC = 0, vOn = false, vBroken = false, useImg = false;

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function p2(n){ return (n < 10 ? "0" : "") + n; }
function mark(i){ return i < MARK.length ? MARK.charAt(i) : String(i + 1); }

function fit(){
  var w = window.innerWidth || document.documentElement.clientWidth;
  var h = window.innerHeight || document.documentElement.clientHeight;
  var k = Math.min(w / 1920, h / 1080);
  var st = $("stage"), t = "scale(" + k + ")";
  st.style.webkitTransform = t; st.style.transform = t;
  st.style.left = ((w - 1920 * k) / 2) + "px"; st.style.top = ((h - 1080 * k) / 2) + "px";
}
function tick(){
  var d = new Date();
  $("clock").innerHTML = d.getHours() + ":" + p2(d.getMinutes());
  $("date").innerHTML = (d.getMonth() + 1) + "月" + d.getDate() + "日（" + "日月火水木金土".charAt(d.getDay()) + "）";
}

/* 長い見出し・本文は枠に収まるまで文字を小さくする */
function shrink(el, start, min, test){
  var s = start;
  el.style.fontSize = s + "px";
  while (s > min && test(el)) { s -= 2; el.style.fontSize = s + "px"; }
}

function buildList(sec){
  var html = "", i, S = SECS[sec];
  for (i = 0; i < S.n; i++) {
    var it = items[S.start + i];
    html += '<td><div class="it" id="it' + i + '"><div class="n">' + mark(i) + " " + esc(listCat(it.cat, S.theme)) +
            '</div><div class="h">' + esc(it.title) + "</div></div></td>";
  }
  $("lr").innerHTML = html;
  /* 一覧の分類名は、一番長いものが枠に収まる大きさに全件をそろえる */
  var ns = $("lr").getElementsByTagName("div"), ok = function(e){ return e.scrollWidth > e.clientWidth; }, minS = 28;
  for (i = 0; i < ns.length; i++) {
    if (ns[i].className === "n") { shrink(ns[i], 28, 16, ok); minS = Math.min(minS, parseInt(ns[i].style.fontSize, 10)); }
  }
  for (i = 0; i < ns.length; i++) {
    if (ns[i].className === "n") ns[i].style.fontSize = minS + "px";
  }
}

function show(i){
  var n = items[i], col = catColor(n.cat), j;
  var sec = secOf(i), S = SECS[sec], li = i - S.start;
  if (sec !== curSec) {
    curSec = sec;
    $("stage").className = S.theme;
    $("tt").innerHTML = esc(S.title);
    buildList(sec);
  }
  if (S.theme === "re") col = "#b8893a";
  $("no").innerHTML = mark(li);
  $("cat").innerHTML = esc(n.cat);
  $("cat").style.background = col;
  $("cnt").innerHTML = (li + 1) + " / " + S.n;
  $("hd").innerHTML = esc(n.title);
  $("bd").innerHTML = esc(n.body) + (n.note ? '<br><span id="nt">' + esc(n.note) + "</span>" : "");
  $("src").innerHTML = n.source ? "出典：" + esc(n.source) : "";
  shrink($("hd"), 92, 44, function(e){ return e.scrollWidth > e.clientWidth; });
  shrink($("bd"), 54, 36, function(e){ return e.scrollHeight > e.clientHeight; });
  for (j = 0; j < S.n; j++) { $("it" + j).className = (j === li) ? "it on" : "it"; }
}

function safeReload(){
  var base = location.href.split("?")[0], x;
  try {
    x = new XMLHttpRequest();
    x.open("GET", base + "?chk=" + new Date().getTime(), true);
    x.onreadystatechange = function(){
      if (x.readyState === 4 && x.status === 200) { location.replace(base + "?t=" + new Date().getTime()); }
    };
    x.send(null);
  } catch (e) {}
}

/* 時計に合わせて切り替え（どのサイネージでも同じ時刻に同じニュース） */
function rotate(){
  /* news.js に seconds がある場合：1件あたりの秒数を固定し、表示開始時に①から順に流す */
  if (SEC > 0) {
    var el = (new Date().getTime() - START) / 1000;
    var loop = Math.floor(el / (SEC * items.length));
    /* 10分以上たったら、1周が終わって①に戻るときに読み込み直す（GitHub側の更新を反映） */
    if (loop !== lastLoop) { if (lastLoop >= 0 && el >= 600) { safeReload(); } lastLoop = loop; }
    var k = Math.floor(el / SEC) % items.length;
    if (k !== lastIdx) { show(k); lastIdx = k; }
    $("prog").style.width = Math.round(1800 * ((el % SEC) / SEC)) + "px";
    return;
  }
  var pos = Math.floor(new Date().getTime() / 1000) % CYCLE;
  if (lastPos >= 0 && pos < lastPos) { safeReload(); }
  lastPos = pos;
  var lap = CYCLE / LAPS, inLap = pos % lap;
  /* 動画あり：1周（5分）の最後に動画を流し、残りの時間をニュースで分ける */
  if (VSEC > 0 && !vBroken) {
    if (inLap >= lap - VSEC) { videoOn(inLap - (lap - VSEC)); return; }
    videoOff();
    var per2 = (lap - VSEC) / items.length;
    var k2 = Math.floor(inLap / per2);
    if (k2 !== lastIdx) { show(k2); lastIdx = k2; }
    $("prog").style.width = Math.round(1800 * ((inLap % per2) / per2)) + "px";
    return;
  }
  videoOff();
  var per = CYCLE / (items.length * LAPS);
  var idx = Math.floor(pos / per) % items.length;
  if (idx !== lastIdx) { show(idx); lastIdx = idx; }
  var r = (pos % per) / per;
  $("prog").style.width = Math.round(1800 * r) + "px";
}

function videoOn(offset){
  var v = $("vid");
  if (!vOn) {
    vOn = true; lastIdx = -1;
    $("vbox").style.display = "block";
    if (useImg) return;
    try { v.currentTime = offset; } catch (e) {}
    var p = v.play(); if (p && p["catch"]) { p["catch"](function(){}); }
  }
}
function videoOff(){
  if (!vOn) return;
  vOn = false;
  $("vbox").style.display = "none";
  try { $("vid").pause(); } catch (e) {}
}

/* 1分ごとに GitHub 上の news.js を確認し、書き換わっていたらすぐに表示を切り替える */
var lastNewsText = null;
function checkNews(){
  var x;
  try {
    x = new XMLHttpRequest();
    x.open("GET", "news.js?chk=" + new Date().getTime(), true);
    x.onreadystatechange = function(){
      if (x.readyState !== 4 || x.status !== 200) return;
      var t = x.responseText || "";
      if (t.indexOf("var NEWS") < 0) return;          /* 読み込み途中・エラーのときは何もしない */
      if (lastNewsText !== null && t !== lastNewsText) { safeReload(); }
      lastNewsText = t;
    };
    x.send(null);
  } catch (e) {}
}

window.onresize = fit;
fit(); tick();
if (typeof NEWS === "undefined" || !NEWS.items || !NEWS.items.length) {
  $("card").style.display = "none"; $("list").style.display = "none"; $("err").style.display = "block";
  setTimeout(function(){ location.replace(location.href.split("?")[0] + "?t=" + new Date().getTime()); }, 60000);
} else {
  /* 今日のニュースのあとに、不動産ニュース（news.js の estate）を続けて流す */
  items = NEWS.items.slice(0);
  SECS = [{ title: NEWS.title || "今日のニュース", start: 0, n: NEWS.items.length, theme: "" }];
  if (NEWS.estate && NEWS.estate.items && NEWS.estate.items.length) {
    SECS.push({ title: NEWS.estate.title || "不動産ニュース", start: items.length, n: NEWS.estate.items.length, theme: "re" });
    items = items.concat(NEWS.estate.items);
  }
  SEC = Number(NEWS.seconds) || 0;
  /* 画像の設定（news.js の image）。1周の最後に画面全体に表示する。読み込めなかったときはニュースだけを流す */
  if (NEWS.image && NEWS.image.file && Number(NEWS.image.seconds) > 0) {
    VSEC = Number(NEWS.image.seconds); useImg = true;
    $("vid").style.display = "none"; $("pic").style.display = "block";
    $("pic").onerror = function(){ vBroken = true; videoOff(); lastIdx = -1; };
    $("pic").src = NEWS.image.file + "?v=" + new Date().getTime();
  }
  /* 動画の設定（news.js の video）。読み込めなかったときはニュースだけを流す */
  else if (NEWS.video && NEWS.video.file && Number(NEWS.video.seconds) > 0) {
    VSEC = Number(NEWS.video.seconds);
    $("vid").onerror = function(){ vBroken = true; videoOff(); lastIdx = -1; };
    $("vid").src = NEWS.video.file;
  }
  $("wk").innerHTML = esc(NEWS.week || "");
  rotate();
  setInterval(rotate, 1000);
  checkNews(); setInterval(checkNews, 60000);
}
setInterval(tick, 5000);
</script>
</body>
</html>
